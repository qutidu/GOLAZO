<!doctype html>
<head> 
<meta name="author" content="Quentin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="c.css" rel="stylesheet">
<title>GOLAZO</title>
<link rel="shortcut icon" type="image/x-icon" href="img/IMG_0170.ico">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Paiement</h2>
        <div class="row">
            <!-- Formulaire de livraison -->
            <div class="col-md-6">
                <h4>Options de livraison</h4>
                <form id="form-paiement">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail*</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="prenom" class="form-label">Prénom*</label>
                        <input type="text" class="form-control" id="prenom" required>
                    </div>
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom*</label>
                        <input type="text" class="form-control" id="nom" required>
                    </div>
                    <div class="mb-3">
                        <label for="adresse" class="form-label">Adresse*</label>
                        <input type="text" class="form-control" id="adresse" required>
                    </div>
                    <div class="mb-3">
                        <label for="telephone" class="form-label">Numéro de téléphone*</label>
                        <input type="tel" class="form-control" id="telephone" required>
                    </div>
                </form>
            </div>

            <!-- Récapitulatif du panier -->
            <div class="col-md-6">
                <h4>Dans ton panier</h4>
                <div id="recap-panier">
                    <!-- Les articles du panier seront ajoutés dynamiquement ici -->
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <h5>Sous-total :</h5>
                    <h5 id="sous-total">€0.00</h5>
                </div>
                <div class="d-flex justify-content-between">
                    <h5>Frais d'expédition :</h5>
                    <h5 id="frais-expedition">€5.00</h5>
                </div>
                <div class="d-flex justify-content-between">
                    <h4>Total :</h4>
                    <h4 id="total">€0.00</h4>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <button class="btn btn-outline-secondary" onclick="window.location.href='panier.html'">Retour au panier</button>
                    <button class="btn btn-primary" id="confirmer-commande">Enregistrer et continuer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="paiement.js"></script>
</body>
</html>
