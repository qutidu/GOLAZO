<!doctype html>
<html lang="fr">
<head>
    <meta name="author" content="Quentin">
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Panier - GOLAZO</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/IMG_0170.ico">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-secondary">
        <a class="navbar-brand text-white" href="#"><h1 style="font-family:'Times New Roman', Times, serif; font-size: 3rem;">GOLAZO</h1></a>
        <ul class="navbar-nav d-flex flex-row gap-lg-5 gap-3" style="font-family:'Times New Roman', Times, serif; font-size: 2rem;">
            <li class="nav-item"><a class="nav-link active text-white" href="accueil.html">Accueil</a></li>
            <li class="nav-item"><a class="nav-link active text-white" href="maillots.html">Maillots</a></li>
            <li class="nav-item"><a class="nav-link active text-white" href="panier.html"><i class="fa-solid fa-cart-shopping"></i> Panier</a></li>
        </ul>
    </nav>

    <main class="container mt-4">
        <h3 class="text-center mb-4">Votre Panier</h3>

        <!-- Cart Items -->
        <div class="row">
            <div class="col-12">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>Article</th>
                                <th>Quantité</th>
                                <th>Prix unitaire</th>
                                <th>Total</th>
                                <th>Supprimer</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Example of an item in the cart -->
                            <tr>
                                <td>
                                    <img src="https://res.cloudinary.com/moresport/image/upload/a_0,c_fill,f_auto,q_auto:good/v1575961299/uploads/assets/1172821-MIDNIGHTNAVY-1-Q4B.jpg" alt="Maillot PSG" class="img-fluid" style="max-width: 50px;">
                                    Maillot PSG 2024
                                </td>
                                <td>
                                    <input type="number" class="form-control" value="1" min="1">
                                </td>
                                <td>€59,99</td>
                                <td>€59,99</td>
                                <td><button class="btn btn-danger"><i class="fa-solid fa-trash"></i></button></td>
                            </tr>
                            <!-- Repeat for each item -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="d-flex justify-content-between">
                    <h4>Total</h4>
                    <h4>€59,99</h4>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <button class="btn btn-outline-secondary">Continuer vos achats</button>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#checkoutModal">Passer à la caisse</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Checkout Modal -->
    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="checkoutModalLabel">Informations de paiement</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom complet</label>
                            <input type="text" class="form-control" id="nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Adresse e-mail</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="adresse" class="form-label">Adresse de livraison</label>
                            <textarea class="form-control" id="adresse" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="carte" class="form-label">Numéro de carte bancaire</label>
                            <input type="text" class="form-control" id="carte" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Confirmer la commande</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="position-relative mt-5 text-center bg-secondary w-100">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <p style="font-family:'Times New Roman', Times, serif;"><b>GOLAZO</b></p>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="social-icons">
                        <a href="https://www.facebook.com/" target="_blank" title="Facebook" class="text-dark fs-3">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="https://www.linkedin.com/" target="_blank" title="LinkedIn" class="text-dark fs-3">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://x.com/" target="_blank" title="X" class="text-dark fs-3">
                            <i class="fab fa-x-twitter"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
