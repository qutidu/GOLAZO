<!doctype html>
<head> 
<meta name="author" content="Quentin">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="c.css" rel="stylesheet">
<title>GOLAZO</title>
<link rel="shortcut icon" type="image/x-icon" href="img/IMG_0170.ico">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-golazo mb-4">
  <a class="navbar-brand"><h1 style="font-family:'Times New Roman', Times, serif; font-size: 3rem;">GOLAZO</h1></a>
  <ul class="navbar-nav d-flex flex-row gap-lg-5 gap-3" style="font-family:'Times New Roman', Times, serif; font-size: 2rem;">
    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Accueil</a></li>
    <li class="nav-item"><a class="nav-link" href="maillots.html">Maillots</a></li>
    <li class="nav-item"><a class="nav-link" href="panier.html"><i class="fa-solid fa-cart-shopping"></i> Panier</a></li>
  </ul>
</nav>

    <main class="container mt-4">
        <h3 class="text-center mb-4">Votre Panier</h3>

        <!-- Table du Panier -->
        <div class="row">
            <div class="col-12">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>Article</th>
                                <th>Quantité</th>
                                <th>Prix unitaire</th>
                                <th>Total</th>
                                <th>Supprimer</th>
                            </tr>
                        </thead>
                        <tbody id="panier-body">
                            <!-- Les articles seront ajoutés dynamiquement ici -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Total et Boutons -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="d-flex justify-content-between">
                    <h4>Total</h4>
                    <h4 id="total">€0.00</h4>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <button class="btn btn-outline-secondary" onclick="window.location.href='maillots.html'">Continuer vos achats</button>
                    <button class="btn btn-warning" onclick="viderPanier()">Vider le panier</button>
                    <button class="btn btn-primary" onclick="window.location.href='paiement.html'">Passer à la caisse</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Paiement -->
    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="checkoutModalLabel">Informations de paiement</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom complet</label>
                            <input type="text" class="form-control" id="nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Adresse e-mail</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="adresse" class="form-label">Adresse de livraison</label>
                            <textarea class="form-control" id="adresse" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="carte" class="form-label">Numéro de carte bancaire</label>
                            <input type="text" class="form-control" id="carte" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Confirmer la commande</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Lien vers le fichier JS externe -->
<script src="panier.js"></script>
</body>
</html>
